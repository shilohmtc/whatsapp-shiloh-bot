name: control-703-fix
on:
  push:
    branches:
      - control/703-postgres-audit-type-fix
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm ci
      - name: Apply bounded patch
        run: python3 scripts/control_703_fix.py
      - name: Focused verification
        run: node --test tests/workspace-booking-confirmation-recovery.test.js tests/booking-confirmation-async-provider-retry.test.js tests/workspace-booking-confirmation-postgres-type.test.js
      - name: Full regression
        id: full_regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log
      - name: Upload full regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-703-full-test-log
          path: full-test.log
          if-no-files-found: error
          retention-days: 2
      - name: Commit verified patch when green
        if: steps.full_regression.outcome == 'success'
        run: |
          if git diff --quiet -- src/services/workspaceClientNotifications.js tests/workspace-booking-confirmation-postgres-type.test.js; then
            echo "Patch already committed; verification only."
            exit 0
          fi
          git config user.name "shiloh-control"
          git config user.email "shilohmtc@gmail.com"
          git add src/services/workspaceClientNotifications.js tests/workspace-booking-confirmation-postgres-type.test.js
          git commit -m "#703 — Fix Workspace confirmation audit identity type"
          git push origin HEAD:control/703-postgres-audit-type-fix
      - name: Enforce full regression gate
        if: steps.full_regression.outcome != 'success'
        run: exit 1
