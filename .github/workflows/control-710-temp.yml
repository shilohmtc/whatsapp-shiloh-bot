name: Control 710 temporary exact patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-exact-patch:
    if: github.head_ref == 'control/710-retire-cancellation-reason'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply bounded #710 patch and focused regression
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const first = source.indexOf(before);
            if (first === -1) throw new Error(`Expected #710 source fragment missing in ${path}`);
            if (source.indexOf(before, first + before.length) !== -1) throw new Error(`Expected one #710 source fragment in ${path}`);
            fs.writeFileSync(path, source.slice(0, first) + after + source.slice(first + before.length));
          }

          replaceOnce(
            'src/presentation/calendarReadOnlyUx.js',
            '<form class="panel-action danger" data-panel-action="appointment:cancel"><label>Cancellation reason<textarea name="reason" required></textarea></label><label><input name="confirmed" type="checkbox" required> I confirm this exact appointment should be cancelled.</label><button type="submit">Cancel appointment</button></form>',
            '<form class="panel-action danger" data-panel-action="appointment:cancel"><label><input name="confirmed" type="checkbox" required> I confirm this exact appointment should be cancelled.</label><button type="submit">Cancel appointment</button></form>',
          );

          replaceOnce(
            'src/presentation/calendarOperationalMutationsUx.js',
            ',reason:form.elements.reason.value',
            '',
          );

          const test = `const test = require('node:test');
          const assert = require('node:assert/strict');

          const { renderCalendarPage } = require('../src/presentation/calendarReadOnlyUx');
          const { calendarOperationalMutationsClientScript } = require('../src/presentation/calendarOperationalMutationsUx');

          function mutableCalendarModel() {
            return {
              view: 'day',
              dateKey: '2026-08-24',
              period: {
                dateKeys: ['2026-08-24'],
                previousAnchor: '2026-08-23',
                nextAnchor: '2026-08-25',
              },
              selectedStaffId: null,
              permittedStaff: [{ id: 1, displayName: 'Julia', schedulingType: 'regular' }],
              timeline: {
                staff: [{ id: 1, displayName: 'Julia', schedulingType: 'regular' }],
                workingWindows: [],
                scheduleExceptions: [],
                recurringClosures: [],
                appointments: [],
                blocks: [],
                leave: [],
                closures: [],
                events: [],
              },
              mutationCapability: {
                enabled: true,
                operations: ['appointment:cancel'],
              },
            };
          }

          test('Manage Appointment cancellation keeps exact confirmation but no reason input', () => {
            const html = renderCalendarPage(mutableCalendarModel());
            const start = html.indexOf('data-panel-action="appointment:cancel"');
            assert.notEqual(start, -1);
            const end = html.indexOf('</form>', start);
            const cancellationForm = html.slice(start, end);
            assert.match(cancellationForm, /name="confirmed" type="checkbox" required/);
            assert.match(cancellationForm, />Cancel appointment<\/button>/);
            assert.doesNotMatch(cancellationForm, /Cancellation reason|name="reason"/i);
          });

          test('Calendar cancellation client remains confirmation-gated and omits reason from request payload', () => {
            const script = calendarOperationalMutationsClientScript();
            const start = script.indexOf("else if(action==='appointment:cancel')");
            assert.notEqual(start, -1);
            const end = script.indexOf("}});});}", start);
            assert.notEqual(end, -1);
            const cancellationBranch = script.slice(start, end);
            assert.match(cancellationBranch, /if\(!form\.elements\.confirmed\.checked\)return;/);
            assert.match(cancellationBranch, /confirmation:\{confirmed:true,appointmentId:data\.id,revision:data\.revision\}/);
            assert.match(cancellationBranch, /requestId:operationId\(\)/);
            assert.doesNotMatch(cancellationBranch, /\breason\s*:/);
          });
          `;
          fs.writeFileSync('tests/calendar-cancellation-ui.test.js', test);
          NODE
          rm .github/workflows/control-710-temp.yml
      - name: Focused regression
        run: node --test tests/calendar-cancellation-ui.test.js
      - name: Commit exact #710 result
        shell: bash
        run: |
          git config user.name "Shiloh Control"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "#710 — Retire cancellation reason UI and payload"
          git push origin HEAD:${{ github.head_ref }}
