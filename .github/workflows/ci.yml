name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run non-mutating regression tests
        run: npm test
      - name: Probe production birthday template status
        run: curl --fail --silent --show-error https://shiloh-whatsapp-bot.onrender.com/audit-read/birthday-template/status
