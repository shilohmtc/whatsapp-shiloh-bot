name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused maintenance framework tests
        run: npm run test:maintenance-framework
      - name: Run focused controlled release migration tests
        run: npm run test:controlled-release-migration
      - name: Run focused Clean Change hygiene test
        run: node --test tests/control-clean-change-gate.test.js
      - name: Run focused SchedulingTimeline parity tests
        run: node --test tests/scheduling-engine-readonly-projection.test.js
      - name: Run focused Calendar UX security tests
        run: node --test tests/calendar-readonly-ux.test.js
      - name: Run focused Shiloh-only cockpit polish tests
        run: node --test tests/calendar-operational-cockpit-polish-v2.test.js tests/shiloh-only-calendar-authority-google-decommission-p0.test.js
      - name: Run focused Christel Calendar viewer-scope bridge tests
        run: node --test tests/christel-calendar-viewer-scope-bridge.test.js
      - name: Run focused staff browser session security tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
        run: node --test tests/staff-browser-session-boundary.test.js
      - name: Run focused staff Calendar access UX tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
        run: node --test tests/staff-calendar-access-ux.test.js
      - name: Run focused Calendar pilot authority retirement tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
        run: node --test tests/calendar-pilot-authority-retirement-p0.test.js
      - name: Run provider-independent auth and real browser-cookie tests
        run: node --test tests/provider-independent-staff-auth.test.js
      - name: Run focused WS-10 service-scoped Calendar authority tests
        run: node --test tests/calendar-service-scoped-booking-authority.test.js tests/calendar-service-scope-matrix.test.js
      - name: Run focused capability-driven Calendar roster authority tests
        run: node --test tests/calendar-staff-roster-booking-authority-p1.test.js tests/calendar-operational-mutations-p0.test.js
      - name: Run focused Calendar booking acceptance tests
        run: node --test tests/calendar-create-booking-acceptance.test.js
      - name: Run focused Calendar new-client booking acceptance tests
        run: node --test tests/calendar-new-client-booking-acceptance.test.js
      - name: Run focused Calendar Clean CRM V2 cutover tests
        run: node --test tests/calendar-clean-crm-v2-cutover-p0.test.js
      - name: Run focused Calendar service-family visual tests
        run: node --test tests/calendar-service-category-visual-identifiers-p2.test.js tests/calendar-service-family-icon-accents-p2.test.js
      - name: Run focused Calendar mobile time-entry tests
        run: node --test tests/calendar-mobile-booking-time-entry-p1.test.js
      - name: Run focused Workspace Clients tests
        run: node --test tests/workspace-clients-v1.test.js
      - name: Run focused Workspace Staff tests
        run: node --test tests/workspace-staff-access-v1.test.js
      - name: Run focused Workspace Services tests
        run: node --test tests/workspace-services-v1.test.js tests/workspace-services-stage-b.test.js tests/workspace-service-creation-v1.test.js
      - name: Run focused Workspace Mobile Polish tests
        run: node --test tests/workspace-mobile-polish-v1.test.js
      - name: Run focused Calendar mobile staff overview tests
        run: node --test tests/calendar-mobile-staff-overview-v1.test.js
      - name: Run non-mutating regression tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
        run: npm test
      - name: Run authenticated Calendar mutation browser proof
        run: node scripts/calendar-operational-mutations-browser-proof.js
      - name: Upload authenticated Calendar mutation browser proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-operational-mutations-browser-proof
          path: artifacts/calendar-operational-mutations-browser-proof
          if-no-files-found: error
          retention-days: 14
      - name: Run authenticated Workspace client notification browser proof
        run: node scripts/workspace-client-notifications-browser-proof.js
      - name: Upload authenticated Workspace client notification browser proof
        uses: actions/upload-artifact@v4
        with:
          name: workspace-client-notifications-browser-proof
          path: artifacts/workspace-client-notifications-browser-proof
          if-no-files-found: error
          retention-days: 14
      - name: Run Calendar Clean CRM V2 browser proof
        run: node scripts/calendar-clean-crm-v2-browser-proof.js
      - name: Upload Calendar Clean CRM V2 browser proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-clean-crm-v2-browser-proof
          path: artifacts/calendar-clean-crm-v2-browser-proof
          if-no-files-found: error
          retention-days: 14
      - name: Generate Workspace Mobile Polish visual proof
        run: node scripts/workspace-mobile-polish-visual-proof.js
      - name: Verify true Workspace mobile CSS viewports
        run: node scripts/workspace-mobile-viewport-proof.js
      - name: Upload Workspace Mobile Polish visual proof
        uses: actions/upload-artifact@v4
        with:
          name: workspace-mobile-polish-v1
          path: artifacts/workspace-mobile-polish-v1
          if-no-files-found: error
          retention-days: 14
      - name: Run Calendar mobile staff overview browser proof
        run: node scripts/calendar-mobile-staff-overview-browser-proof.js
      - name: Upload Calendar mobile staff overview browser proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-mobile-staff-overview-v1
          path: artifacts/calendar-mobile-staff-overview-v1
          if-no-files-found: error
          retention-days: 14
      - name: Generate Calendar cockpit visual proof
        run: node scripts/calendar-cockpit-visual-proof.js
      - name: Upload Calendar cockpit visual proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-cockpit-visual-proof
          path: artifacts/calendar-cockpit-visual-proof
          if-no-files-found: error
          retention-days: 14
      - name: Generate Workspace Clients visual proof
        run: node scripts/workspace-clients-visual-proof.js
      - name: Upload Workspace Clients visual proof
        uses: actions/upload-artifact@v4
        with:
          name: workspace-clients-v1-visual-proof
          path: artifacts/workspace-clients-v1-visual-proof
          if-no-files-found: error
          retention-days: 14
      - name: Generate Workspace Staff visual proof
        run: node scripts/workspace-staff-visual-proof.js
      - name: Upload Workspace Staff visual proof
        uses: actions/upload-artifact@v4
        with:
          name: workspace-staff-v1-visual-proof
          path: artifacts/workspace-staff-v1-visual-proof
          if-no-files-found: error
          retention-days: 14
      - name: Generate Workspace Services visual proof
        run: node scripts/workspace-services-visual-proof.js
      - name: Upload Workspace Services visual proof
        uses: actions/upload-artifact@v4
        with:
          name: workspace-services-v1-visual-proof
          path: artifacts/workspace-services-v1-visual-proof
          if-no-files-found: error
          retention-days: 14
