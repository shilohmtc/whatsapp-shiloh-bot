name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused maintenance framework tests
        run: npm run test:maintenance-framework
      - name: Run focused SchedulingTimeline parity tests
        run: node --test tests/scheduling-engine-readonly-projection.test.js
      - name: Run focused Calendar UX security tests
        run: node --test tests/calendar-readonly-ux.test.js
      - name: Run focused Shiloh-only cockpit polish tests
        run: node --test tests/calendar-operational-cockpit-polish-v2.test.js tests/shiloh-only-calendar-authority-google-decommission-p0.test.js
      - name: Run focused Christel Calendar viewer-scope bridge tests
        run: node --test tests/christel-calendar-viewer-scope-bridge.test.js
      - name: Run focused staff browser session security tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_MODE_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_ADMIN_IDS: ''
        run: node --test tests/staff-browser-session-boundary.test.js
      - name: Run focused staff Calendar access UX tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_MODE_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_ADMIN_IDS: ''
        run: node --test tests/staff-calendar-access-ux.test.js
      - name: Run focused staff Calendar pilot gate tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_MODE_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_ADMIN_IDS: ''
        run: node --test tests/staff-calendar-pilot-gate.test.js
      - name: Run provider-independent auth and real browser-cookie tests
        run: node --test tests/provider-independent-staff-auth.test.js
      - name: Run focused emergency Christel Calendar bootstrap security tests
        run: node --test tests/emergency-christel-calendar-bootstrap.test.js
      - name: Run focused WS-10 service-scoped Calendar authority tests
        run: node --test tests/calendar-service-scoped-booking-authority.test.js tests/calendar-service-scope-matrix.test.js
      - name: Run focused emergency Christel Calendar booking acceptance tests
        run: node --test tests/emergency-christel-calendar-booking-acceptance.test.js
      - name: Run focused Calendar new-client booking acceptance tests
        run: node --test tests/calendar-new-client-booking-acceptance.test.js
      - name: Run focused Calendar Clean CRM V2 cutover tests
        run: node --test tests/calendar-clean-crm-v2-cutover-p0.test.js
      - name: Run non-mutating regression tests
        env:
          SHILOH_STAFF_BROWSER_AUTH_WHATSAPP_DELIVERY_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_SESSION_CALENDAR_BRIDGE_ENABLED: 'false'
          SHILOH_CALENDAR_READONLY_UX_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_MODE_ENABLED: 'false'
          SHILOH_STAFF_BROWSER_PILOT_ADMIN_IDS: ''
        run: npm test
      - name: Run authenticated Calendar mutation browser proof
        run: node scripts/calendar-operational-mutations-browser-proof.js
      - name: Upload authenticated Calendar mutation browser proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-operational-mutations-browser-proof
          path: artifacts/calendar-operational-mutations-browser-proof
          if-no-files-found: error
          retention-days: 14
      - name: Run Calendar Clean CRM V2 browser proof
        run: node scripts/calendar-clean-crm-v2-browser-proof.js
      - name: Upload Calendar Clean CRM V2 browser proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-clean-crm-v2-browser-proof
          path: artifacts/calendar-clean-crm-v2-browser-proof
          if-no-files-found: error
          retention-days: 14
      - name: Generate Calendar cockpit visual proof
        run: node scripts/calendar-cockpit-visual-proof.js
      - name: Upload Calendar cockpit visual proof
        uses: actions/upload-artifact@v4
        with:
          name: calendar-cockpit-visual-proof
          path: artifacts/calendar-cockpit-visual-proof
          if-no-files-found: error
          retention-days: 14
