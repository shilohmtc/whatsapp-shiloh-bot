name: control-temp-727-apply

on:
  push:
    branches: [work/727-phone-week-planner-v3]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: work/727-phone-week-planner-v3
          fetch-depth: 0
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize verified patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('src/services/calendarReadOnlyUx.js')
          text = service.read_text()
          old = "  attachCanonicalClientMobiles,\n  uxError,\n};"
          new = "  attachCanonicalClientMobiles,\n  uxError,\n  isSundayDateKey,\n};"
          if text.count(old) != 1:
              raise SystemExit(f'expected one service export anchor, found {text.count(old)}')
          service.write_text(text.replace(old, new, 1))

          patch = Path('scripts/control-temp-727-apply.py')
          text = patch.read_text()
          old_block = '''replace_once(\n    'tests/calendar-view-parity-month-v1.test.js',\n    \"  assert.match(html, /view=day&amp;date=2026-09-18&amp;staff=21&amp;staff=22&amp;staff=23/);\",\n    \"  assert.match(html, /view=week&amp;date=2026-09-18&amp;staff=21&amp;staff=22&amp;staff=23/);\",\n)'''
          new_block = '''path = 'tests/calendar-view-parity-month-v1.test.js'\ntext = read(path)\nold = \"  assert.match(html, /view=day&amp;date=2026-09-18&amp;staff=21&amp;staff=22&amp;staff=23/);\"\nnew = \"  assert.match(html, /view=week&amp;date=2026-09-18&amp;staff=21&amp;staff=22&amp;staff=23/);\"\nif text.count(old) != 2:\n    raise RuntimeError(f'{path}: expected two Day drill-in assertions, found {text.count(old)}')\nwrite(path, text.replace(old, new))'''
          if text.count(old_block) != 1:
              raise SystemExit(f'expected one duplicate-test patch block, found {text.count(old_block)}')
          patch.write_text(text.replace(old_block, new_block, 1))
          PY
      - name: Apply bounded #727 patch
        run: python3 scripts/control-temp-727-apply.py
      - name: Verify temporary scaffolding retired
        run: |
          test ! -e scripts/control-temp-727-apply.py
          test ! -e .github/workflows/control-temp-727-apply.yml
          if find scripts .github/workflows -maxdepth 1 -type f -name 'control-temp-727-*' | grep -q .; then
            echo 'Unexpected #727 temporary artifact remains' >&2
            exit 1
          fi
      - name: Run focused #727 regression
        run: node --test tests/calendar-phone-week-planner-v3.test.js tests/calendar-phone-compact-v2-p1.test.js tests/calendar-view-parity-month-v1.test.js tests/calendar-readonly-ux.test.js
      - name: Commit implementation
        run: |
          git config user.name "Shiloh Control"
          git config user.email "shiloh-control@users.noreply.github.com"
          git add -A
          git commit -m "#727 implement Phone Week Planner V3"
          git push origin HEAD:work/727-phone-week-planner-v3
