name: Control temp #837 Android PWA repair

on:
  push:
    branches:
      - work/837-android-pwa-genuine-install

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/837-android-pwa-genuine-install
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Implement genuine Android PWA prerequisites
        run: |
          python3 <<'PY'
          from pathlib import Path
          import struct, zlib, binascii

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {label}')
              return text.replace(old, new, 1)

          # Presentation: raster manifest icons, stable identity, no shortcut fallback.
          path = Path('src/presentation/workspacePwa.js')
          text = path.read_text()
          text = replace_once(text, "const PWA_VERSION = '791-v1';", "const PWA_VERSION = '837-v1';", 'PWA version')
          text = replace_once(text, "const ICON_URLS = Object.freeze([\n  `${PWA_BASE}/icon-192.svg?v=${PWA_VERSION}`,\n  `${PWA_BASE}/icon-512.svg?v=${PWA_VERSION}`,\n]);", "const ICON_URLS = Object.freeze([\n  `${PWA_BASE}/icon-192.png?v=${PWA_VERSION}`,\n  `${PWA_BASE}/icon-512.png?v=${PWA_VERSION}`,\n  `${PWA_BASE}/icon-maskable-512.png?v=${PWA_VERSION}`,\n]);\nconst SVG_ICON_URLS = Object.freeze([\n  `${PWA_BASE}/icon-192.svg?v=${PWA_VERSION}`,\n  `${PWA_BASE}/icon-512.svg?v=${PWA_VERSION}`,\n]);", 'icon URL registry')
          text = replace_once(text, "    icons: [\n      { src: ICON_URLS[0], sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },\n      { src: ICON_URLS[1], sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' },\n    ],", "    icons: [\n      { src: ICON_URLS[0], sizes: '192x192', type: 'image/png', purpose: 'any' },\n      { src: ICON_URLS[1], sizes: '512x512', type: 'image/png', purpose: 'any' },\n      { src: ICON_URLS[2], sizes: '512x512', type: 'image/png', purpose: 'maskable' },\n    ],", 'manifest icon declarations')
          text = replace_once(text, "    `<link rel=\"icon\" href=\"${ICON_URLS[0]}\" type=\"image/svg+xml\">`,", "    `<link rel=\"icon\" href=\"${SVG_ICON_URLS[0]}\" type=\"image/svg+xml\">`,", 'favicon')
          old_install = "function installAction(){if(!androidDevice()||standalone())return;let card=document.querySelector('[data-shiloh-browser-install]');if(card)return;card=document.createElement('section');card.setAttribute('data-shiloh-browser-install','');card.setAttribute('role','note');card.style.cssText='box-sizing:border-box;margin:14px auto 0;width:min(calc(100% - 28px),680px);padding:16px 18px 16px 44px;border:1px solid #cfdad3;border-radius:16px;background:#f4f8f5;color:#20322b;box-shadow:0 6px 20px rgba(20,45,35,.08);font:400 .94rem/1.45 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif';const eyebrow=document.createElement('div');eyebrow.textContent='INSTALL SHILOH';eyebrow.style.cssText='margin-bottom:5px;color:#496b5a;font-size:.72rem;font-weight:800;letter-spacing:.12em';const title=document.createElement('strong');title.textContent=deferredInstallPrompt?'Install Shiloh on this Android phone':'Install Shiloh on this Android phone';title.style.cssText='display:block;margin-bottom:8px;font-size:1.05rem';card.append(eyebrow,title);if(!deferredInstallPrompt){const copy=document.createElement('div');copy.textContent='In Chrome, tap the ⋮ menu, then choose Install app or Add to Home screen. The wording may vary by Chrome version.';card.append(copy);}else{const button=document.createElement('button');button.type='button';button.textContent='Install Shiloh';button.style.cssText='min-height:44px;border:1px solid #496b5a;border-radius:999px;padding:9px 15px;background:#496b5a;color:#fff;font:700 .9rem/1.2 system-ui,sans-serif;cursor:pointer';button.addEventListener('click',async()=>{const prompt=deferredInstallPrompt;if(!prompt)return;deferredInstallPrompt=null;removeInstallCard('[data-shiloh-browser-install]');await prompt.prompt();const choice=await prompt.userChoice.catch(()=>null);if(choice&&choice.outcome!=='accepted')deferredInstallPrompt=prompt;installAction();});card.append(button);}const target=document.body.firstElementChild;document.body.insertBefore(card,target||null);}" 
          new_install = "function installAction(){if(!androidDevice()||standalone()||!deferredInstallPrompt){removeInstallCard('[data-shiloh-browser-install]');return;}let card=document.querySelector('[data-shiloh-browser-install]');if(card)return;card=document.createElement('section');card.setAttribute('data-shiloh-browser-install','');card.setAttribute('role','note');card.style.cssText='box-sizing:border-box;margin:14px auto 0;width:min(calc(100% - 28px),680px);padding:16px 18px 16px 44px;border:1px solid #cfdad3;border-radius:16px;background:#f4f8f5;color:#20322b;box-shadow:0 6px 20px rgba(20,45,35,.08);font:400 .94rem/1.45 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif';const eyebrow=document.createElement('div');eyebrow.textContent='INSTALL SHILOH';eyebrow.style.cssText='margin-bottom:5px;color:#496b5a;font-size:.72rem;font-weight:800;letter-spacing:.12em';const title=document.createElement('strong');title.textContent='Install Shiloh on this Android phone';title.style.cssText='display:block;margin-bottom:8px;font-size:1.05rem';const button=document.createElement('button');button.type='button';button.textContent='Install Shiloh';button.style.cssText='min-height:44px;border:1px solid #496b5a;border-radius:999px;padding:9px 15px;background:#496b5a;color:#fff;font:700 .9rem/1.2 system-ui,sans-serif;cursor:pointer';button.addEventListener('click',async()=>{const prompt=deferredInstallPrompt;if(!prompt)return;deferredInstallPrompt=null;removeInstallCard('[data-shiloh-browser-install]');await prompt.prompt();const choice=await prompt.userChoice.catch(()=>null);if(choice&&choice.outcome!=='accepted')deferredInstallPrompt=prompt;installAction();});card.append(eyebrow,title,button);const target=document.body.firstElementChild;document.body.insertBefore(card,target||null);}" 
          text = replace_once(text, old_install, new_install, 'Android install action')
          text = replace_once(text, "  ICON_URLS,\n", "  ICON_URLS,\n  SVG_ICON_URLS,\n", 'icon export')
          path.write_text(text)

          # Router: serve raster assets with explicit PNG MIME and immutable caching.
          path = Path('src/routes/workspacePwa.js')
          text = path.read_text()
          text = replace_once(text, "const express = require('express');", "const express = require('express');\nconst path = require('path');\nconst PWA_ICON_ASSET_DIR = path.join(__dirname, '../../public/assets/pwa');", 'route imports')
          text = replace_once(text, "function shouldDecoratePwaHtmlPath(pathname) {", "function sendPwaPng(res, filename) {\n  setPublicAssetHeaders(res, { immutable: true });\n  res.type('image/png');\n  return res.sendFile(path.join(PWA_ICON_ASSET_DIR, filename));\n}\n\nfunction shouldDecoratePwaHtmlPath(pathname) {", 'PNG sender')
          marker = "  router.get('/icon-192.svg', (_req, res) => {"
          png_routes = "  router.get('/icon-192.png', (_req, res) => sendPwaPng(res, 'shiloh-pwa-192.png'));\n\n  router.get('/icon-512.png', (_req, res) => sendPwaPng(res, 'shiloh-pwa-512.png'));\n\n  router.get('/icon-maskable-512.png', (_req, res) => sendPwaPng(res, 'shiloh-pwa-maskable-512.png'));\n\n"
          text = replace_once(text, marker, png_routes + marker, 'PNG routes')
          path.write_text(text)

          # Generate deterministic RGBA PNG assets with only Python stdlib.
          out = Path('public/assets/pwa')
          out.mkdir(parents=True, exist_ok=True)

          BG=(23,56,45,255); CREAM=(247,245,239,255); GREEN=(73,107,90,255)
          def inside_round_rect(x,y,left,top,right,bottom,r):
              if left+r <= x < right-r or top+r <= y < bottom-r:
                  return left <= x < right and top <= y < bottom
              cx = left+r if x < left+r else right-r-1
              cy = top+r if y < top+r else bottom-r-1
              return (x-cx)*(x-cx)+(y-cy)*(y-cy) <= r*r
          def icon_pixels(size, maskable=False):
              pixels=[BG]*(size*size)
              inset=round(size*(0.18 if maskable else 0.11))
              rr=round(size*(0.18 if maskable else 0.15))
              for y in range(inset,size-inset):
                  for x in range(inset,size-inset):
                      if inside_round_rect(x,y,inset,inset,size-inset,size-inset,rr): pixels[y*size+x]=CREAM
              mark=round(size*0.34); cx=size//2; cy=round(size*0.37); rad=mark//2
              for y in range(max(0,cy-rad),min(size,cy+rad+1)):
                  for x in range(max(0,cx-rad),min(size,cx+rad+1)):
                      if (x-cx)*(x-cx)+(y-cy)*(y-cy) <= rad*rad: pixels[y*size+x]=GREEN
              sw=max(10,round(size*0.07)); sh=round(size*0.22); sx=cx-sw//2; sy=round(size*0.49); sr=sw//2
              for y in range(sy,min(size,sy+sh)):
                  for x in range(sx,min(size,sx+sw)):
                      if inside_round_rect(x,y,sx,sy,sx+sw,sy+sh,sr): pixels[y*size+x]=GREEN
              return pixels
          def png_bytes(size, maskable=False):
              raw=bytearray()
              pixels=icon_pixels(size,maskable)
              for y in range(size):
                  raw.append(0)
                  for r,g,b,a in pixels[y*size:(y+1)*size]: raw.extend((r,g,b,a))
              def chunk(kind,data):
                  return struct.pack('>I',len(data))+kind+data+struct.pack('>I',binascii.crc32(kind+data)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          (out/'shiloh-pwa-192.png').write_bytes(png_bytes(192))
          (out/'shiloh-pwa-512.png').write_bytes(png_bytes(512))
          (out/'shiloh-pwa-maskable-512.png').write_bytes(png_bytes(512,True))

          # Tests: version bump + installability/asset checks.
          path = Path('tests/workspace-pwa-v1.test.js')
          text = path.read_text().replace('791-v1', '837-v1')
          append = r'''

test('#837 Android manifest uses real raster install icons and never suggests a plain Chrome shortcut fallback', () => {
  const manifest = workspacePwaManifest();
  assert.deepEqual(manifest.icons.map(icon => [icon.sizes, icon.type, icon.purpose]), [
    ['192x192', 'image/png', 'any'],
    ['512x512', 'image/png', 'any'],
    ['512x512', 'image/png', 'maskable'],
  ]);
  const dimensions = (filename) => {
    const buffer = fs.readFileSync(path.join(__dirname, '..', 'public', 'assets', 'pwa', filename));
    assert.equal(buffer.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
    return [buffer.readUInt32BE(16), buffer.readUInt32BE(20)];
  };
  assert.deepEqual(dimensions('shiloh-pwa-192.png'), [192, 192]);
  assert.deepEqual(dimensions('shiloh-pwa-512.png'), [512, 512]);
  assert.deepEqual(dimensions('shiloh-pwa-maskable-512.png'), [512, 512]);
  const client = workspacePwaClientScript();
  assert.match(client, /beforeinstallprompt/);
  assert.match(client, /appinstalled/);
  assert.match(client, /!deferredInstallPrompt/);
  assert.doesNotMatch(client, /In Chrome, tap the .*Add to Home screen/);
});
'''
          if '#837 Android manifest uses real raster install icons' not in text:
              text += append
          path.write_text(text)

          # Browser proof: prove raster assets + active service worker prerequisites; do not fake OS install.
          path = Path('scripts/workspace-pwa-v1-browser-proof.js')
          text = path.read_text()
          text = replace_once(text, "  app.get('/proof-client.js', (_req, res) => res.type('application/javascript').send(\"addEventListener('load',()=>{document.documentElement.dataset.rootOverflow=String(document.documentElement.scrollWidth>document.documentElement.clientWidth);document.documentElement.dataset.displayStandalone=String(!!(matchMedia&&matchMedia('(display-mode: standalone)').matches));});\"));", "  app.get('/proof-client.js', (_req, res) => res.type('application/javascript').send(\"addEventListener('load',async()=>{document.documentElement.dataset.rootOverflow=String(document.documentElement.scrollWidth>document.documentElement.clientWidth);document.documentElement.dataset.displayStandalone=String(!!(matchMedia&&matchMedia('(display-mode: standalone)').matches));try{await navigator.serviceWorker.ready;document.documentElement.dataset.swReady='true';}catch(_error){document.documentElement.dataset.swReady='false';}});\"));", 'browser proof SW readiness')
          text = replace_once(text, "    assert.equal(manifest.start_url, '/calendar/pwa/launch');", "    assert.equal(manifest.start_url, '/calendar/pwa/launch');\n    assert.deepEqual(manifest.icons.map(icon => [icon.sizes, icon.type, icon.purpose]), [['192x192','image/png','any'],['512x512','image/png','any'],['512x512','image/png','maskable']]);", 'browser manifest raster assertions')
          text = replace_once(text, "    assert.match(phoneDom, /manifest\\.webmanifest\\?v=791-v1/);\n    assert.match(phoneDom, /data-shiloh-browser-install/);", "    assert.match(phoneDom, /manifest\\.webmanifest\\?v=837-v1/);\n    assert.match(phoneDom, /data-sw-ready=\"true\"/);\n    assert.doesNotMatch(phoneDom, /In Chrome, tap the .*Add to Home screen/);", 'phone install proof')
          text = replace_once(text, "      standaloneLimitation: 'Headless Chromium proves manifest standalone metadata and the installed delivery shell, but cannot reproduce an OS home-screen installation window. Real-device install chrome remains a release acceptance check.',", "      installabilityPrerequisites: { raster192: true, raster512: true, maskable512: true, serviceWorkerReady: true, stableId: manifest.id, stableStartUrl: manifest.start_url, stableScope: manifest.scope },\n      standaloneLimitation: 'Headless Chromium proves raster manifest prerequisites, service-worker readiness and standalone metadata, but cannot prove Android OS/WebAPK Home-screen installation. Real-device standalone launch remains the final acceptance check.',", 'proof report')
          path.write_text(text)
          PY
      - name: Focused #837 verification
        run: |
          node --check src/presentation/workspacePwa.js
          node --check src/routes/workspacePwa.js
          node --check scripts/workspace-pwa-v1-browser-proof.js
          node --test tests/workspace-pwa-v1.test.js tests/calendar-ux-mobile-pwa-repair.test.js
          node scripts/workspace-pwa-v1-browser-proof.js
      - name: Commit implementation and remove temporary executor
        run: |
          rm .github/workflows/control-temp-837-implement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/presentation/workspacePwa.js src/routes/workspacePwa.js scripts/workspace-pwa-v1-browser-proof.js tests/workspace-pwa-v1.test.js public/assets/pwa .github/workflows/control-temp-837-implement.yml
          git commit -m '#837 Repair Android PWA installability prerequisites'
          git push origin HEAD:work/837-android-pwa-genuine-install
