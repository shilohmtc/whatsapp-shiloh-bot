name: P3 catalogue migration one-shot
on:
  push:
    paths:
      - '.github/workflows/p3-catalogue-migrate-once.yml'
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm guarded migrations are idempotent
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 'https://shiloh-whatsapp-bot.onrender.com/admin/catalogue-migrations/one-shot-7f8a2d91c4e64b9a')"
          echo "$body"
          echo "$body" | grep -q '"status":"complete"'
      - name: Verify active catalogue description coverage
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 'https://shiloh-whatsapp-bot.onrender.com/audit-read/catalogue/status')"
          echo "$body"
          echo "$body" | grep -q '"activeServiceCount":49'
          echo "$body" | grep -q '"allActiveServicesHaveCustomerDescription":true'
          echo "$body" | grep -q '"missingCustomerDescription":\[\]'
      - name: Verify public services page
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 'https://shiloh-whatsapp-bot.onrender.com/services')"
          echo "$body" | grep -q 'Shiloh Services'
          echo "$body" | grep -q 'Book via WhatsApp'
