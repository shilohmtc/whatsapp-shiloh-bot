name: Temporary Lucide API probe 835

on:
  push:
    branches:
      - work/835-lucide-calendar-polish

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/835-lucide-calendar-polish
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Probe Lucide CommonJS exports
        run: |
          node <<'NODE'
          const lucide = require('lucide');
          const wanted = ['icons','createIcons','createElement','Calendar','CalendarDays','CalendarPlus','History','CircleSlash','CalendarMinus','ChevronLeft','ChevronRight','LayoutDashboard','Users','MessageSquare','UserRoundPlus','Sparkles','ChartNoAxesColumnIncreasing','Clock3','LogOut','LockKeyhole','Plus','CalendarCheck'];
          for (const key of wanted) {
            const value = lucide[key];
            const shape = Array.isArray(value) ? `array:${value.length}` : typeof value;
            console.log(`${key}=${shape}`);
            if (Array.isArray(value)) console.log(`${key}.sample=${JSON.stringify(value).slice(0,500)}`);
          }
          if (lucide.icons) {
            for (const key of ['calendar','calendar-days','calendar-plus','history','circle-slash','calendar-minus','chevron-left','chevron-right','layout-dashboard','users','message-square','user-round-plus','sparkles','chart-no-axes-column-increasing','clock-3','log-out','lock-keyhole','plus','calendar-check']) {
              const value = lucide.icons[key];
              console.log(`icons.${key}=${Array.isArray(value)?`array:${value.length}`:typeof value}`);
              if (Array.isArray(value)) console.log(`icons.${key}.sample=${JSON.stringify(value).slice(0,500)}`);
            }
          }
          NODE
