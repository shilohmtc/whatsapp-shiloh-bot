name: Calendar Appointment Authority V1 Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  appointment_authority_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Run focused authority regressions
        run: node --test tests/calendar-appointment-authority-v1.test.js
      - name: Install pinned Chromium proof tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove Phone and Desktop appointment authority UX
        run: node scripts/calendar-appointment-authority-browser-proof.js
      - name: Upload Phone and Desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-appointment-authority-v1-evidence
          path: artifacts/calendar-appointment-authority-v1
          if-no-files-found: error
          retention-days: 14
