name: Control temp 837 runner

on:
  push:
    branches:
      - work/837-android-pwa-genuine-install

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/837-android-pwa-genuine-install
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Execute bounded implementation embedded in first temp workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/control-temp-837-implement.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          block = source[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          code = '\n'.join(line[indent:] for line in block)
          exec(compile(code, 'control-temp-837-embedded.py', 'exec'))
          PY
      - name: Focused verification
        run: |
          node --check src/presentation/workspacePwa.js
          node --check src/routes/workspacePwa.js
          node --check scripts/workspace-pwa-v1-browser-proof.js
          node --test tests/workspace-pwa-v1.test.js tests/calendar-ux-mobile-pwa-repair.test.js
          node scripts/workspace-pwa-v1-browser-proof.js
      - name: Commit implementation and remove temp workflows
        run: |
          rm .github/workflows/control-temp-837-implement.yml .github/workflows/control-temp-837-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '#837 Repair Android PWA installability prerequisites'
          git push origin HEAD:work/837-android-pwa-genuine-install
