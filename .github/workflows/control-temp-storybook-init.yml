name: control-temp Storybook initializer

on:
  push:
    branches:
      - work/865-storybook-ui-primitives
    paths:
      - .github/workflows/control-temp-storybook-init.yml

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/865-storybook-ui-primitives
          fetch-depth: 0
      - name: Use Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install minimal Storybook HTML workshop
        run: |
          npm install --save-dev storybook@^10.6.0 @storybook/html-vite@^10.6.0 @storybook/addon-a11y@^10.6.0
          npm pkg set 'scripts.storybook=storybook dev -p 6006' 'scripts.build-storybook=storybook build'
      - name: Configure isolated ESM Storybook surface
        run: |
          mkdir -p .storybook stories
          cat > .storybook/main.mjs <<'EOF'
          const config = {
            stories: ['../stories/**/*.stories.js'],
            addons: ['@storybook/addon-a11y'],
            framework: {
              name: '@storybook/html-vite',
              options: {},
            },
          };
          export default config;
          EOF
          cat > .storybook/preview.mjs <<'EOF'
          const preview = {
            parameters: {
              a11y: {
                test: 'todo',
              },
            },
          };
          export default preview;
          EOF
          cat > stories/FoundationSmoke.stories.js <<'EOF'
          export default {
            title: 'Foundations/Storybook Smoke',
          };

          export const Ready = {
            render: () => '<div style="font:16px system-ui;padding:24px">Shiloh Storybook HTML/Vite workshop ready</div>',
          };
          EOF
      - name: Verify minimal Storybook build
        run: npm run build-storybook -- --quiet
      - name: Confirm production dependency audit is unchanged-safe
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified package, lockfile and Storybook config
        run: |
          git config user.name "shilohmtc"
          git config user.email "shilohmtc@gmail.com"
          git add package.json package-lock.json .storybook stories/FoundationSmoke.stories.js
          git commit -m "#865 initialize minimal Storybook 10 HTML workshop"
          git push origin HEAD:work/865-storybook-ui-primitives
