name: Control Temp 708

on:
  push:
    branches: [control/708-clean-change-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[708-docs-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: control/708-clean-change-gate
      - name: Apply canonical governance patch
        run: python3 scripts/control-temp-708-apply.py
      - name: Commit governance only
        run: |
          git config user.name "shiloh-control"
          git config user.email "shilohmtc@gmail.com"
          git add docs/SHILOH_CONTROL_RULES.md
          git diff --cached --quiet && exit 0
          git commit -m "#708 — Canonicalize Clean Change gate [708-docs-applied]"
          git push origin HEAD:control/708-clean-change-gate
