name: Temporary Lucide lock bootstrap 835

on:
  push:
    branches:
      - work/835-lucide-calendar-polish

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: work/835-lucide-calendar-polish
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Pin Lucide and regenerate npm lockfile
        run: npm install lucide@1.43.0 --save-exact --package-lock-only --ignore-scripts
      - name: Commit package metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package metadata changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "#835 pin Lucide package"
          git push origin HEAD:work/835-lucide-calendar-polish
