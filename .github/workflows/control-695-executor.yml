name: Control 695 isolated executor

on:
  push:
    branches:
      - control/695-workspace-service-visibility
    paths:
      - scripts/control_695_patch.py
      - .github/workflows/control-695-executor.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control/695-workspace-service-visibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Apply assertion-based patch
        run: python3 scripts/control_695_patch.py
      - name: Focused visibility and Services regressions
        run: >-
          node --test
          tests/workspace-services-visibility-p1.test.js
          tests/workspace-services-stage-b.test.js
          tests/workspace-service-creation-v1.test.js
          tests/calendar-service-scope-matrix.test.js
          tests/calendar-staff-roster-booking-authority-p1.test.js
      - name: Full repository regression
        run: npm test
      - name: Commit verified source patch
        run: |
          git config user.name 'shiloh-control'
          git config user.email 'shilohmtc@gmail.com'
          git add src/services/workspaceServices.js tests/workspace-services-visibility-p1.test.js
          git diff --cached --check
          git commit -m '#695 — Enforce tenant-private Workspace Services visibility'
          git push origin HEAD:control/695-workspace-service-visibility
