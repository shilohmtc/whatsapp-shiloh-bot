name: Public Website V1 Proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public_website_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Node 24.14.1
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Run focused public website regressions
        run: node --test tests/public-website-v1.test.js
      - name: Install pinned Chromium proof tooling
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove Phone and Desktop public website contracts
        run: node scripts/public-website-browser-proof.js
      - name: Upload Phone and Desktop evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-website-v1-evidence
          path: artifacts/public-website-v1
          if-no-files-found: error
          retention-days: 14
