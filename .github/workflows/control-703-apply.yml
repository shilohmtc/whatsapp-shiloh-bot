name: Control 703 isolated patch

on:
  push:
    branches:
      - control/703-booking-confirmation-async-failure
    paths:
      - .github/workflows/control-703-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Apply bounded patch
        run: python3 scripts/control-703-apply.py
      - name: Focused verification
        run: node --test tests/booking-confirmation-async-provider-retry.test.js tests/workspace-booking-confirmation-recovery.test.js
      - name: Full regression
        run: npm test
      - name: Commit verified patch
        run: |
          git config user.name "Shiloh Control"
          git config user.email "actions@users.noreply.github.com"
          git add src/services/whatsappStatusEvidence.js src/services/customerBookingConfirmation.js src/presentation/calendarOperationalMutationsUx.js tests/booking-confirmation-async-provider-retry.test.js
          git diff --cached --check
          git commit -m "fix(whatsapp): reconcile async confirmation failures (#703)"
          git push origin HEAD:control/703-booking-confirmation-async-failure
