name: control-temp-723-apply

on:
  push:
    branches:
      - control/723-phone-calendar-density-copy-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply bounded #723 presentation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source_path = Path('src/presentation/calendarReadOnlyUx.js')
          source = source_path.read_text()
          source = replace_once(
              source,
              'grid-template-columns:repeat(var(--lane-count),minmax(270px,calc(100vw - 76px)))!important',
              'grid-template-columns:repeat(var(--lane-count),210px)!important',
              'Phone Day lane grid width',
          )
          source = replace_once(
              source,
              'body[data-calendar-view="day"] .workspace-main .day-time-grid .lane{min-width:270px!important;width:auto!important;border-right:1px solid var(--line)!important}',
              'body[data-calendar-view="day"] .workspace-main .day-time-grid .lane{min-width:210px!important;width:210px!important;border-right:1px solid var(--line)!important}',
              'Phone Day lane width',
          )
          source = replace_once(
              source,
              '.operation-status{display:block;min-height:1.2em;margin:5px 0 10px;color:var(--muted);font-size:.78rem}',
              '.operation-status{display:block;min-height:1.2em;margin:5px 0 10px;color:var(--muted);font-size:.78rem}.operation-status:empty{display:none}',
              'empty mutation status collapse',
          )
          source = replace_once(
              source,
              '.panel-hint{font-size:.72rem;color:var(--muted)}',
              '',
              'unused management panel hint style',
          )
          source = replace_once(
              source,
              '<span class="panel-hint">Every change is revalidated by canonical Calendar authority.</span>',
              '',
              'management panel helper copy',
          )
          source = replace_once(
              source,
              '<span class="operation-status" role="status" aria-live="polite" data-calendar-operation-status>Canonical changes are revalidated when saved.</span>',
              '<span class="operation-status" role="status" aria-live="polite" data-calendar-operation-status></span>',
              'static mutation status copy',
          )
          source_path.write_text(source)

          proof_path = Path('scripts/calendar-spatial-phone-week-browser-proof.js')
          proof = proof_path.read_text()
          proof = replace_once(
              proof,
              "        minBookingSlotHeight:Math.min(...Array.from(document.querySelectorAll('[data-calendar-booking-slot]')).map(node=>node.getBoundingClientRect().height)),\n      };",
              "        minBookingSlotHeight:Math.min(...Array.from(document.querySelectorAll('[data-calendar-booking-slot]')).map(node=>node.getBoundingClientRect().height)),\n        operationStatusText:document.querySelector('[data-calendar-operation-status]')?.textContent.trim()||'',\n        operationStatusDisplay:document.querySelector('[data-calendar-operation-status]')?getComputedStyle(document.querySelector('[data-calendar-operation-status]')).display:'',\n        panelHintPresent:Boolean(document.querySelector('.panel-hint')),\n      };",
              'Phone Day proof copy metrics',
          )
          proof = replace_once(
              proof,
              "    assert.ok(dayMetrics.minLaneWidth >= 270, 'Phone Day practitioner lane is not readable');",
              "    assert.ok(dayMetrics.minLaneWidth >= 200 && dayMetrics.minLaneWidth <= 220, 'Phone Day practitioner lane did not use compact density');",
              'Phone Day proof lane assertion',
          )
          proof = replace_once(
              proof,
              "    assert.ok(dayMetrics.scrollerScrollWidth > dayMetrics.scrollerClientWidth, 'Phone Day multi-practitioner lanes do not pan');",
              "    assert.ok(dayMetrics.scrollerScrollWidth > dayMetrics.scrollerClientWidth, 'Phone Day multi-practitioner lanes do not pan');\n    assert.ok(dayMetrics.scrollerScrollWidth <= 470, 'Phone Day still requires excessive horizontal travel between two practitioner lanes');\n    assert.equal(dayMetrics.operationStatusText, '');\n    assert.equal(dayMetrics.operationStatusDisplay, 'none');\n    assert.equal(dayMetrics.panelHintPresent, false);",
              'Phone Day proof density/copy assertions',
          )
          proof_path.write_text(proof)
          PY
      - name: Run focused #723 regressions
        run: node --test tests/calendar-phone-density-copy-polish-p1.test.js tests/calendar-spatial-phone-week-p1.test.js tests/calendar-first-phone-booking-p1.test.js
      - name: Commit bounded source changes
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "shiloh-control"
          git config user.email "shiloh-control@users.noreply.github.com"
          git add src/presentation/calendarReadOnlyUx.js scripts/calendar-spatial-phone-week-browser-proof.js
          git commit -m "#723 tighten Phone Day density and remove internal copy"
          git push origin HEAD:${GITHUB_REF_NAME}
