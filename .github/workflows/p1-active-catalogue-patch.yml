name: P1 active catalogue patch

on:
  push:
    paths:
      - '.github/workflows/p1-active-catalogue-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Patch booking service verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/services/bookingIntent.js')
          s = p.read_text()
          s = s.replace('const { retrieveKnowledge } = require("./knowledge");\n', '')

          replacement = r'''function comparableServiceName(service = "") {
            return String(service || "")
              .normalize("NFKC")
              .toLowerCase()
              .replace(/&/g, " and ")
              .replace(/[^a-z0-9 ]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
          }

          function matchActiveServiceName(requestedService, activeNames = []) {
            const requested = normalizeServiceName(requestedService);
            const requestedComparable = comparableServiceName(requested);
            if (!requestedComparable) return { matched: false, reason: "missing" };

            const names = [...new Set((activeNames || []).map((name) => String(name || "").trim()).filter(Boolean))];
            const exact = names.filter((name) => comparableServiceName(name) === requestedComparable);
            if (exact.length === 1) return { matched: true, name: exact[0], reason: "exact_active_crm_match" };
            if (exact.length > 1) return { matched: false, reason: "ambiguous_active_crm_match" };

            const requestedTokens = significantServiceTokens(requested);
            if (!requestedTokens.length) return { matched: false, reason: "not_active_in_crm" };

            const tokenMatches = names.filter((name) => {
              const candidateTokens = new Set(significantServiceTokens(name));
              return requestedTokens.every((token) => candidateTokens.has(token));
            });

            if (tokenMatches.length === 1) {
              return { matched: true, name: tokenMatches[0], reason: "unique_active_crm_token_match" };
            }
            if (tokenMatches.length > 1) return { matched: false, reason: "ambiguous_active_crm_match" };
            return { matched: false, reason: "not_active_in_crm" };
          }

          async function verifyService(service) {
            if (!service?.trim()) return { verified: false, reason: "missing" };

            try {
              const result = await pool.query(
                `SELECT name FROM services WHERE status = 'active' ORDER BY name`
              );
              const match = matchActiveServiceName(service, result.rows.map((row) => row.name));
              return {
                verified: match.matched,
                reason: match.reason,
                canonicalName: match.name || null,
              };
            } catch (error) {
              logger.warn({ err: error }, "Could not verify requested booking service against active CRM catalogue");
              return { verified: false, reason: "verification_unavailable", canonicalName: null };
            }
          }

          async function getIntent(phone) {'''

          pattern = re.compile(r'async function hasLexicalKnowledgeMatch\(service\) \{.*?\nasync function getIntent\(phone\) \{', re.S)
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
            raise SystemExit(f'Expected one legacy service-verification block, replaced {count}')

          old_export = '  verifyService,\n  normalizeServiceName,\n'
          new_export = '  verifyService,\n  matchActiveServiceName,\n  normalizeServiceName,\n'
          if old_export not in s2:
            raise SystemExit('Expected bookingIntent export block not found')
          s2 = s2.replace(old_export, new_export, 1)
          p.write_text(s2)

          test = Path('tests/p1-active-service-verification.test.js')
          test.write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          const { matchActiveServiceName } = require("../src/services/bookingIntent");

          const active = [
            "Full Body Swedish",
            "Hot Stone Massage",
            "Targeted Area-Specific Sports Massage",
            "Medi-Heel No Gel",
            "Medi-Heel With Gel",
            "Clarity Facial (Blackheads, Whiteheads & Acne)",
          ];

          test("active CRM services and safe aliases resolve uniquely", () => {
            assert.equal(matchActiveServiceName("swedish massage", active).name, "Full Body Swedish");
            assert.equal(matchActiveServiceName("hot stone", active).name, "Hot Stone Massage");
            assert.equal(matchActiveServiceName("Targeted Area-Specific Sports Massage", active).matched, true);
          });

          test("retired Goldie-only services do not validate against active CRM", () => {
            for (const legacy of ["Toe Gel Application", "Pressotherapy Single Session", "Waxing"]) {
              const result = matchActiveServiceName(legacy, active);
              assert.equal(result.matched, false, legacy);
              assert.equal(result.reason, "not_active_in_crm", legacy);
            }
          });

          test("ambiguous generic service text fails closed", () => {
            const result = matchActiveServiceName("Medi-Heel", active);
            assert.equal(result.matched, false);
            assert.equal(result.reason, "ambiguous_active_crm_match");
          });
          ''')

          workflow = Path('.github/workflows/p1-active-catalogue-patch.yml')
          workflow.unlink()
          PY
      - name: Verify targeted tests
        run: npm test
      - name: Commit guarded production change
        run: |
          git config user.name shilohmtc
          git config user.email shilohmtc@gmail.com
          git add src/services/bookingIntent.js tests/p1-active-service-verification.test.js .github/workflows/p1-active-catalogue-patch.yml
          git commit -m "P1: validate bookings against active CRM catalogue"
          git push origin HEAD:main
