name: Control 710 temporary browser proof alignment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  align-browser-proof:
    if: github.head_ref == 'control/710-retire-cancellation-reason'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Align authenticated cancellation proof with retired reason field
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/calendar-operational-mutations-browser-proof.js';
          let source = fs.readFileSync(path, 'utf8');
          function replaceOnce(before, after) {
            const first = source.indexOf(before);
            if (first === -1) throw new Error(`Expected #710 proof fragment missing: ${before}`);
            if (source.indexOf(before, first + before.length) !== -1) throw new Error(`Expected exactly one #710 proof fragment: ${before}`);
            source = source.slice(0, first) + after + source.slice(first + before.length);
          }
          replaceOnce(
            "const form=document.querySelector('[data-panel-action=\"appointment:cancel\"]');form.elements.reason.value='Synthetic cancellation check';form.requestSubmit();return true;",
            "const form=document.querySelector('[data-panel-action=\"appointment:cancel\"]');form.requestSubmit();return true;",
          );
          replaceOnce(
            "await panelOperation('appointment:cancel', `form.elements.reason.value='Synthetic cancellation check';form.elements.confirmed.checked=true`, 'cancel');",
            "await panelOperation('appointment:cancel', `form.elements.confirmed.checked=true`, 'cancel');",
          );
          fs.writeFileSync(path, source);
          NODE
          rm .github/workflows/control-710-proof-temp.yml
      - name: Run authenticated Calendar mutation browser proof
        run: node scripts/calendar-operational-mutations-browser-proof.js
      - name: Commit aligned proof
        shell: bash
        run: |
          git config user.name "Shiloh Control"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "#710 — Align cancellation browser proof"
          git push origin HEAD:${{ github.head_ref }}
